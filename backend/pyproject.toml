[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
